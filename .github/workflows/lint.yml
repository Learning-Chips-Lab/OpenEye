name: Lint
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: install verilator
        run: sudo apt install -y verilator

      - name: run verilator lint
        # PE.v and PE_cluster.v `include generated parameter headers that only
        # exist in a simulation build directory; the ifdef fallbacks give the
        # linter the same defaults.
        run: verilator --lint-only -Wall -Ihdl/ +define+USE_INTERNAL_PARAMS_PE +define+USE_INTERNAL_PARAMS_PE_cluster hdl/OpenEye_Parallel.v
