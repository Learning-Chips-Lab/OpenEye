[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=42", "wheel"]

[project]
authors = [{name = "Denis Lebold", email = "denis.lebold@uni-due.de"}]
dependencies = [
  "tensorflow>=2.21.0",
]
name = "open_eye"
requires-python = ">=3.13,<3.14"
version = "1.0"

[tool.setuptools]
package-dir = {"" = "."}
packages = ["open_eye"]

[tool.pytest.ini_options]
log_cli = true
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_level = "INFO"

[dependency-groups]
dev = [
  "cocotb>=2.1.0",
  "cocotb-test>=0.3.0",
  "pytest>=9.2.0",
  "autoapi>=2.0.1",
  "myst-parser>=5.1.0",
  "sphinx>=9.2.0",
  "sphinx-autoapi>=3.9.0",
  "sphinx-rtd-theme>=3.1.0",
  "sphinx-verilog-domain>=0.2.post21",
  "sphinxcontrib-hdl-diagrams>=0.0.post160",
]
